syntax = "proto3";

package wallet;

// 1. Client <-> Node (Functional Requirements)
service WalletService {
    rpc CreateAccount (AccountRequest) returns (AccountResponse);
    rpc GetBalance (AccountRequest) returns (BalanceResponse);
    rpc TransferFunds (TransactionRequest) returns (TransactionResponse);
}

// 2. Node <-> Node (Raft Consensus for High Availability)
service ConsensusService {
    rpc RequestVote (VoteRequest) returns (VoteResponse);
    rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
}

// 3. Shard <-> Shard (2PC for Atomicity)
service ShardService {
    rpc Prepare (TwoPCRequest) returns (TwoPCResponse);
    rpc CommitOrAbort (TwoPCRequest) returns (TwoPCResponse);
}

// --- Messages ---

message AccountRequest {
    int32 account_id = 1;
}

message AccountResponse {
    bool success = 1;
    string message = 2;
}

message BalanceResponse {
    int32 account_id = 1;
    double balance = 2;
    bool success = 3;
    string leader_id = 4; // To help Client find the Leader
}

message TransactionRequest {
    int32 from_account = 1;
    int32 to_account = 2;
    double amount = 3;
    string transaction_id = 4;
}

message TransactionResponse {
    bool success = 1;
    string message = 2;
}

message VoteRequest {
    int32 term = 1;
    string candidate_id = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
}

message VoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
}

message LogEntry {
    int32 index = 1;
    int32 term = 2;
    string command = 3;
}

message AppendEntriesRequest {
    int32 term = 1;
    string leader_id = 2;
    int32 prev_log_index = 3;
    int32 prev_log_term = 4;
    repeated LogEntry entries = 5;
    int32 leader_commit = 6;
}

message AppendEntriesResponse {
    int32 term = 1;
    bool success = 2;
}

message TwoPCRequest {
    string transaction_id = 1;
    int32 account_id = 2;
    double amount = 3;
    string action = 4; // "PREPARE", "COMMIT", "ABORT"
}

message TwoPCResponse {
    bool ack = 1;
    string message = 2;
}